<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 7 - Layout Website</title>
    <style>
        #wrapper {
            width: 270px;
            margin: 30px auto;
            padding: 5px;
            border: 3px solid black;
        }
        header {
            height: 42px;
            border: 2px solid black;
            margin-bottom: 5px;
        }
        nav {
            width: 48px;
            height: 200px;
            border: 2px solid black;
            float: left;
        }
        main {
            width: 198px;
            height: 200px;
            border: 2px solid black;
            float: right;
        }
        footer {
            height: 30px;
            border: 2px solid black;
            margin-top: 5px;
            clear: both;
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <header>header</header>
        <nav>nav</nav>
        <main>main</main>
        <footer>footer</footer>
    </div>
</body>
</html>
